<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doc, Is This Normal?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      height: auto;
      padding: 16px;
      box-sizing: border-box;
    }

    [hidden] { display: none !important; }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      box-sizing: border-box;
      background: var(--pad);
      border: 5px solid var(--navy);
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--navy);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--white);
      -webkit-text-stroke: 6px var(--navy);
      paint-order: stroke fill;
    }

    label, legend {
      display: block;
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    #nickname {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      font: 500 20px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 16px;
    }

    #nickname:focus {
      outline: 4px solid var(--bandage);
    }

    fieldset {
      margin: 20px 0 0;
      padding: 0;
      border: 0;
    }

    .avatars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .avatars input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .avatars label {
      margin: 0;
      padding: 4px;
      aspect-ratio: 1;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.1s;
    }

    .avatars img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .avatars input:checked + label {
      background: var(--bandage);
      transform: scale(1.06);
    }

    .avatars input:focus-visible + label {
      outline: 4px solid var(--white);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font: 700 22px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--bandage);
      border: 4px solid var(--navy);
      border-radius: 18px;
      box-shadow: 0 4px 0 var(--navy);
      cursor: pointer;
    }

    button:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--navy);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button.secondary {
      background: var(--white);
      font-size: 18px;
      padding: 10px;
    }

    .error {
      margin: 12px 0 0;
      font-weight: 500;
      color: #c0392b;
    }

    .status {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
    }

    .link-button {
      width: auto;
      margin-top: 12px;
      padding: 4px 8px;
      font-size: 16px;
      font-weight: 500;
      background: none;
      border: 0;
      box-shadow: none;
      text-decoration: underline;
    }

    .link-button:active:not(:disabled) {
      transform: none;
      box-shadow: none;
    }

    .notice {
      margin: 14px 0 0;
      font-weight: 500;
    }

    /* Home */
    .me {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .me img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .me p {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .phase {
      margin: 8px 0 4px;
      padding: 12px;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
    }

    .phase-name {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .phase-timer {
      margin: 2px 0 0;
      font-size: 34px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--bandage-dark);
    }

    .actions button + button {
      margin-top: 12px;
    }

    /* Symptom sentence, used on the symptom, prescription, vote and finals screens */
    .symptom-text {
      margin: 0;
      padding: 14px 16px;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.5;
      text-align: left;
      overflow-wrap: anywhere;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
    }

    .blank {
      display: inline-block;
      min-width: 80px;
      border-bottom: 3px dashed var(--bandage-dark);
      font-weight: 700;
    }

    .blank.filled {
      display: inline;
      min-width: 0;
      padding: 0 6px;
      background: var(--bandage);
      border-bottom: 0;
      border-radius: 8px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* Patient mode: a text field per blank, with suggestion chips under it */
    .slot {
      margin: 18px 0 0;
      text-align: left;
    }

    .slot input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      font: 500 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 14px;
    }

    .slot input:focus {
      outline: 4px solid var(--bandage);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .chips button {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 15px;
      font-weight: 500;
      background: var(--white);
      border-width: 3px;
      border-radius: 999px;
      box-shadow: none;
    }

    .chips .shuffle {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      background: var(--bandage);
    }

    .chips .shuffle svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row button {
      flex: 1;
    }

    /* Doctor mode */
    .field-label {
      margin: 18px 0 8px;
      text-align: left;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 110px;
      box-sizing: border-box;
      padding: 12px 16px;
      font: 500 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 16px;
      resize: none;
    }

    textarea::placeholder {
      color: #9a9aa5;
    }

    textarea:focus {
      outline: 4px solid var(--bandage);
    }

    .counter {
      margin: 4px 0 0;
      font-size: 14px;
      text-align: right;
    }

    /* Shortlist voting */
    .vote-option {
      margin-top: 14px;
      padding: 14px;
      text-align: left;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
    }

    .vote-option p {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .vote-option button {
      margin: 0;
      padding: 8px;
      font-size: 22px;
      background: var(--white);
      border-width: 3px;
      box-shadow: 0 3px 0 var(--navy);
    }

    .vote-option button[aria-pressed="true"] {
      background: var(--bandage);
    }

    /* Finals ballot */
    .finalist {
      display: block;
      margin-top: 14px;
      padding: 14px;
      font: inherit;
      text-align: left;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
      box-shadow: 0 4px 0 var(--navy);
    }

    .finalist[aria-pressed="true"] {
      background: var(--bandage);
    }

    .finalist .symptom {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .finalist .prescription {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .finalist img {
      flex: none;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
  </style>
  <script src="/play.js" defer></script>
</head>
<body>
  <main class="card">
    <p id="loading" class="status">Loading…</p>

    <form id="join-form" class="screen" hidden>
      <h1>Who are you?</h1>

      <label for="nickname">Nickname</label>
      <input id="nickname" name="nickname" type="text" maxlength="16" autocomplete="off" required>

      <fieldset>
        <legend>Pick your avatar</legend>
        <div class="avatars" id="avatars"></div>
      </fieldset>

      <button type="submit" id="join-button" disabled>Join game</button>
      <p class="error" hidden></p>
    </form>

    <section id="home" class="screen" hidden>
      <div class="me">
        <img id="me-avatar" alt="">
        <p id="me-name"></p>
      </div>
      <div class="phase">
        <p class="phase-name" id="phase-name"></p>
        <p class="phase-timer" id="phase-timer"></p>
      </div>
      <div class="actions">
        <button type="button" data-phases="clinic_open" id="home-symptom">Write a symptom</button>
        <button type="button" data-phases="clinic_open" id="home-prescribe">Treat a patient</button>
        <button type="button" data-phases="clinic_open second_opinions" id="home-vote">Vote</button>
        <button type="button" data-phases="finals" id="home-finals">Pick a winner</button>
      </div>
      <p class="notice" id="home-notice" hidden></p>
      <button type="button" class="link-button" id="home-edit">Change nickname or avatar</button>
    </section>

    <form id="symptom-form" class="screen" hidden>
      <h1>What's wrong with you?</h1>
      <p class="symptom-text" id="symptom-preview"></p>
      <div id="symptom-slots"></div>
      <p class="counter" id="symptom-counter"></p>
      <div class="row">
        <button type="button" class="secondary" id="surprise-me">Surprise me</button>
        <button type="submit" id="symptom-submit" disabled>Submit</button>
      </div>
      <p class="error" hidden></p>
      <button type="button" class="link-button" data-back>Back</button>
    </form>

    <form id="prescription-form" class="screen" hidden>
      <h1>Your diagnosis, doctor?</h1>
      <p class="field-label"><strong>The patient says:</strong></p>
      <p class="symptom-text" id="prescription-symptom"></p>
      <label class="field-label" for="prescription-text">Your prescription</label>
      <textarea id="prescription-text" maxlength="120" placeholder="Take two of these and…" required></textarea>
      <p class="counter" id="prescription-counter"></p>
      <button type="submit" id="prescription-submit" disabled>Prescribe</button>
      <p class="error" hidden></p>
      <button type="button" class="link-button" data-back>Back</button>
    </form>

    <form id="vote-form" class="screen" hidden>
      <h1>Which prescription works?</h1>
      <p class="symptom-text" id="vote-symptom"></p>
      <div id="vote-options"></div>
      <button type="submit" id="vote-submit">Skip</button>
      <p class="error" hidden></p>
      <button type="button" class="link-button" data-back>Back</button>
    </form>

    <section id="finals" class="screen" hidden>
      <h1>Pick your favorite</h1>
      <div id="finalists"></div>
      <p class="error" hidden></p>
      <button type="button" class="link-button" data-back>Back</button>
    </section>
  </main>
</body>
</html>
