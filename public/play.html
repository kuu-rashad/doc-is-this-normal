<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join · Doc, Is This Normal?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      height: auto;
      padding: 16px;
      box-sizing: border-box;
    }

    [hidden] { display: none !important; }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      box-sizing: border-box;
      background: var(--pad);
      border: 5px solid var(--navy);
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--navy);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--white);
      -webkit-text-stroke: 6px var(--navy);
      paint-order: stroke fill;
    }

    label, legend {
      display: block;
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    /* Looks like one text box: a fixed "Dr." followed by the actual input. */
    .name-field {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      font: 500 20px "Fredoka", system-ui, sans-serif;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 16px;
    }

    .name-field:focus-within {
      outline: 4px solid var(--bandage);
    }

    .name-field span {
      font-weight: 700;
    }

    .name-field input {
      flex: 1;
      min-width: 0;
      padding: 0;
      font: inherit;
      color: var(--navy);
      background: none;
      border: 0;
      outline: none;
    }

    fieldset {
      margin: 20px 0 0;
      padding: 0;
      border: 0;
    }

    .avatars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .avatars input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .avatars label {
      margin: 0;
      padding: 4px;
      aspect-ratio: 1;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.1s;
    }

    .avatars img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .avatars input:checked + label {
      background: var(--bandage);
      transform: scale(1.06);
    }

    .avatars input:focus-visible + label {
      outline: 4px solid var(--white);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font: 700 22px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--bandage);
      border: 4px solid var(--navy);
      border-radius: 18px;
      box-shadow: 0 4px 0 var(--navy);
      cursor: pointer;
    }

    button:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--navy);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button.secondary {
      background: var(--white);
      font-size: 18px;
      padding: 10px;
    }

    .error {
      margin: 12px 0 0;
      font-weight: 500;
      color: #c0392b;
    }

    .status {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
    }

    .link-button {
      width: auto;
      margin-top: 12px;
      padding: 4px 8px;
      font-size: 16px;
      font-weight: 500;
      background: none;
      border: 0;
      box-shadow: none;
      text-decoration: underline;
    }

    .link-button:active:not(:disabled) {
      transform: none;
      box-shadow: none;
    }

    .notice {
      margin: 14px 0 0;
      font-weight: 500;
    }

    /* Menu */
    .me {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .me img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .me p {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .menu button + button {
      margin-top: 12px;
    }

    /* Symptom sentence, used on the symptom, treatment and vote screens */
    .symptom-text {
      margin: 0;
      padding: 14px 16px;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.5;
      text-align: left;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
    }

    .blank {
      display: inline-block;
      min-width: 80px;
      border-bottom: 3px dashed var(--bandage-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .blank.filled {
      min-width: 0;
      padding: 0 6px;
      background: var(--bandage);
      border-bottom: 0;
      border-radius: 8px;
    }

    .slot {
      margin: 20px 0 0;
      text-align: left;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chips input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .chips label {
      margin: 0;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 500;
      background: var(--white);
      border: 3px solid var(--navy);
      border-radius: 999px;
      cursor: pointer;
    }

    .chips input:checked + label {
      background: var(--bandage);
      font-weight: 700;
    }

    .chips input:focus-visible + label {
      outline: 3px solid var(--white);
    }

    /* Treatment */
    .field-label {
      margin: 18px 0 8px;
      text-align: left;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      box-sizing: border-box;
      padding: 12px 16px;
      font: 500 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 16px;
      resize: none;
    }

    textarea:focus {
      outline: 4px solid var(--bandage);
    }

    .counter {
      margin: 4px 0 0;
      font-size: 14px;
      text-align: right;
    }

    /* Voting */
    .vote-option {
      margin-top: 14px;
      padding: 14px;
      text-align: left;
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 18px;
    }

    .vote-option p {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .thumbs {
      display: flex;
      gap: 8px;
    }

    .thumbs button {
      flex: 1;
      margin: 0;
      padding: 8px;
      font-size: 20px;
      background: var(--white);
      border-width: 3px;
      box-shadow: 0 3px 0 var(--navy);
    }

    .thumbs button[aria-pressed="true"] {
      background: var(--bandage);
    }
  </style>
  <script src="/play.js" defer></script>
</head>
<body>
  <main class="card">
    <p id="loading" class="status">Loading…</p>

    <form id="join-form" class="screen" hidden>
      <h1>Who are you?</h1>

      <label for="nickname">Nickname</label>
      <div class="name-field">
        <span aria-hidden="true">Dr.</span>
        <input id="nickname" name="nickname" type="text" maxlength="16" autocomplete="off" required>
      </div>

      <fieldset>
        <legend>Pick your avatar</legend>
        <div class="avatars" id="avatars"></div>
      </fieldset>

      <button type="submit" id="join-button" disabled>Join game</button>
      <p class="error" hidden></p>
    </form>

    <section id="menu" class="screen menu" hidden>
      <div class="me">
        <img id="me-avatar" alt="">
        <p id="me-name"></p>
      </div>
      <h1>What next?</h1>
      <button type="button" id="menu-symptom">Describe a symptom</button>
      <button type="button" id="menu-treat">Treat a patient</button>
      <button type="button" id="menu-vote">Vote on treatments</button>
      <p class="notice" id="menu-notice" hidden></p>
      <button type="button" class="link-button" id="menu-edit">Change nickname or avatar</button>
    </section>

    <form id="symptom-form" class="screen" hidden>
      <h1>What's wrong with you?</h1>
      <p class="symptom-text" id="symptom-preview"></p>
      <div id="symptom-slots"></div>
      <button type="submit" id="symptom-submit" disabled>Submit symptom</button>
      <p class="error" hidden></p>
      <button type="button" class="link-button" data-back>Back</button>
    </form>

    <form id="treatment-form" class="screen" hidden>
      <h1>Your diagnosis, doctor?</h1>
      <p class="field-label"><strong>The patient says:</strong></p>
      <p class="symptom-text" id="treatment-symptom"></p>
      <label class="field-label" for="treatment-text">Your treatment</label>
      <textarea id="treatment-text" maxlength="150" required></textarea>
      <p class="counter" id="treatment-counter"></p>
      <button type="submit" id="treatment-submit" disabled>Prescribe</button>
      <p class="error" hidden></p>
      <button type="button" class="link-button" data-back>Back</button>
    </form>

    <form id="vote-form" class="screen" hidden>
      <h1>Which treatment works?</h1>
      <p class="symptom-text" id="vote-symptom"></p>
      <div id="vote-options"></div>
      <button type="submit" id="vote-submit">Skip</button>
      <p class="error" hidden></p>
    </form>
  </main>
</body>
</html>
