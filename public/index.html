<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doc, Is This Normal?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <style>
    html, body {
      overflow: hidden;
    }

    :root {
      --players-bar: 9vw;
    }

    /* Bandage hangs off the right edge of the screen, QR code sits on its pad. */
    .join {
      position: fixed;
      right: -8.7vw;
      bottom: calc(var(--players-bar) + 0.8vw);
      width: 37vw;
      aspect-ratio: 1024 / 344;
      background: url("/bandage.png") center / contain no-repeat;
    }

    .join img {
      position: absolute;
      left: 50.1%;
      top: 50%;
      width: 22%;
      transform: translate(-50%, -50%);
    }

    .join p {
      position: absolute;
      left: 50.1%;
      bottom: 100%;
      margin: 0 0 0.3vw;
      transform: translateX(-50%);
      font-size: 3.6vw;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      color: var(--white);
      -webkit-text-stroke: 0.5vw var(--navy);
      paint-order: stroke fill;
    }

    /* Finished symptom + winning treatment, rotating. Kept clear of the bandage in the corner. */
    .showcase {
      position: fixed;
      left: 6vw;
      top: calc((100vh - var(--players-bar)) / 2);
      width: 56vw;
      transform: translateY(-50%);
      padding: 2.5vw 3vw;
      box-sizing: border-box;
      background: var(--pad);
      border: 0.4vw solid var(--navy);
      border-radius: 2.5vw;
      box-shadow: 0 0.5vw 0 var(--navy);
      transition: opacity 0.6s;
    }

    .showcase.fading {
      opacity: 0;
    }

    .showcase .label {
      margin: 0 0 0.6vw;
      font-size: 1.4vw;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--bandage-dark);
    }

    .showcase .doctor {
      margin: 0 0 0.4vw;
      font-size: 1.7vw;
      font-weight: 700;
      color: var(--bandage-dark);
    }

    .showcase .symptom {
      margin: 0;
      font-size: 2.8vw;
      font-weight: 700;
      line-height: 1.25;
    }

    .showcase .prescription {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 2vw;
      padding-top: 2vw;
      border-top: 0.3vw dashed var(--bandage-dark);
    }

    .showcase .prescription img {
      flex: none;
      width: 9vw;
      height: 9vw;
      object-fit: contain;
    }

    .showcase .treatment {
      margin: 0;
      font-size: 2.2vw;
      font-weight: 500;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .showcase .score {
      margin: 0.8vw 0 0;
      font-size: 1.6vw;
      font-weight: 700;
    }

    .showcase .waiting {
      margin: 0;
      font-size: 2.4vw;
      font-weight: 700;
      text-align: center;
    }

    /* Everyone who has joined, along the bottom. Scrolls sideways when they don't all fit. */
    .players {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 2vw;
      height: var(--players-bar);
      padding: 0 0 0 2.5vw;
      box-sizing: border-box;
      background: var(--navy);
    }

    .players h2 {
      flex: none;
      margin: 0;
      font-size: 3vw;
      font-weight: 700;
      color: var(--white);
    }

    .players-viewport {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, #000 2vw, #000 calc(100% - 4vw), transparent);
    }

    .players-track {
      display: flex;
      width: max-content;
    }

    /* The list is shown twice in a row, so sliding by half its width loops seamlessly. */
    .players-track.scrolling {
      animation: players-scroll var(--scroll-duration) linear infinite;
    }

    @keyframes players-scroll {
      to { transform: translateX(-50%); }
    }

    .players-group {
      display: flex;
      gap: 1.2vw;
      padding: 0 1.2vw 0 2vw;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3vw;
      width: 6.6vw;
    }

    .player img {
      width: 5.6vw;
      height: 5.6vw;
      box-sizing: border-box;
      padding: 0.3vw;
      object-fit: contain;
      background: var(--pad);
      border-radius: 1.2vw;
    }

    .player span {
      max-width: 100%;
      overflow: hidden;
      font-size: 1.15vw;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .players .empty {
      margin: 0;
      padding-left: 2vw;
      font-size: 1.8vw;
      font-weight: 700;
      color: var(--white);
    }

    @media (prefers-reduced-motion: reduce) {
      .players-track.scrolling { animation: none; }
    }

    /* Settings */
    .settings-button {
      position: fixed;
      top: 1.5vw;
      right: 1.5vw;
      display: grid;
      place-items: center;
      width: clamp(48px, 4.5vw, 96px);
      height: clamp(48px, 4.5vw, 96px);
      padding: 0;
      color: var(--navy);
      background: var(--pad);
      border: clamp(4px, 0.35vw, 7px) solid var(--navy);
      border-radius: 24%;
      cursor: pointer;
    }

    .settings-button svg {
      width: 62%;
      height: 62%;
      fill: currentColor;
    }

    .settings-button:active {
      transform: scale(0.94);
    }

    .settings {
      width: min(420px, calc(100vw - 32px));
      box-sizing: border-box;
      padding: 24px;
      font-family: inherit;
      color: var(--navy);
      background: var(--pad);
      border: 5px solid var(--navy);
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--navy);
    }

    .settings::backdrop {
      background: rgb(11 20 51 / 0.5);
    }

    .settings h2 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .settings label {
      display: block;
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 700;
    }

    .settings input[type="password"] {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 14px;
      font: 500 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 14px;
    }

    .settings input[type="password"]:focus {
      outline: 4px solid var(--bandage);
    }

    .settings .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .settings input[type="range"] {
      flex: 1;
      accent-color: var(--bandage-dark);
    }

    .settings output {
      width: 3.5em;
      font-weight: 500;
      text-align: right;
    }

    .settings button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font: 700 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--navy);
      cursor: pointer;
    }

    .settings button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--navy);
    }

    .settings .danger {
      color: var(--white);
      background: #c0392b;
    }

    .settings #reset-game {
      margin-top: 24px;
    }

    .settings .reset-status {
      margin: 10px 0 0;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <audio id="music" src="/audio/peachtea-somewhere-in-the-elevator.ogg" loop autoplay></audio>

  <button type="button" class="settings-button" id="settings-open" aria-label="Settings">
    <!-- "settings" icon from Google Material Symbols (Apache 2.0) -->
    <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M421-80q-14 0-25-9t-13-23l-15-94q-19-7-40-19t-37-25l-86 40q-14 6-28 1.5T155-226L97-330q-8-13-4.5-27t15.5-23l80-59q-2-9-2.5-20.5T185-480q0-9 .5-20.5T188-521l-80-59q-12-9-15.5-23t4.5-27l58-104q8-13 22-17.5t28 1.5l86 40q16-13 37-25t40-18l15-95q2-14 13-23t25-9h118q14 0 25 9t13 23l15 94q19 7 40.5 18.5T669-710l86-40q14-6 27.5-1.5T804-734l59 104q8 13 4.5 27.5T852-580l-80 57q2 10 2.5 21.5t.5 21.5q0 10-.5 21t-2.5 21l80 58q12 8 15.5 22.5T863-330l-58 104q-8 13-22 17.5t-28-1.5l-86-40q-16 13-36.5 25.5T592-206l-15 94q-2 14-13 23t-25 9H421Zm59-270q54 0 92-38t38-92q0-54-38-92t-92-38q-54 0-92 38t-38 92q0 54 38 92t92 38Z"/></svg>
  </button>

  <dialog class="settings" id="settings">
    <form id="admin-login" method="dialog">
      <h2>Admin only</h2>
      <label>
        Password
        <input type="password" id="admin-password" autocomplete="off" required>
      </label>
      <p class="reset-status" id="login-error" hidden></p>
      <button type="submit" id="login-submit">Unlock</button>
      <button type="button" data-close>Cancel</button>
    </form>

    <div id="admin-panel" hidden>
      <h2>Settings</h2>
      <label>
        Music volume
        <span class="volume-row">
          <input type="range" id="music-volume" min="0" max="100" step="5">
          <output for="music-volume" id="music-volume-value"></output>
        </span>
      </label>
      <label>
        Sound effects volume
        <span class="volume-row">
          <input type="range" id="sfx-volume" min="0" max="100" step="5">
          <output for="sfx-volume" id="sfx-volume-value"></output>
        </span>
      </label>
      <button type="button" class="danger" id="reset-game">Reset game</button>
      <button type="button" class="danger" id="reset-everything">Delete all players and data</button>
      <p class="reset-status" id="reset-status" hidden></p>
      <button type="button" data-close>Close</button>
    </div>
  </dialog>

  <section class="showcase" id="showcase" aria-live="polite">
    <p class="waiting">Waiting for the first diagnosis…</p>
  </section>

  <section class="players" aria-label="Players">
    <h2>Players:</h2>
    <div class="players-viewport">
      <div class="players-track" id="players-track"></div>
    </div>
  </section>

  <div class="join">
    <p>SCAN ME!</p>
    <img src="/qr.svg" alt="QR code to join the game">
  </div>

  <script>
    // Background music starts as soon as the page loads. If the browser blocks autoplay,
    // it starts on the first click or key press instead.
    const music = document.getElementById("music");

    // ---------- Settings ----------
    // Volumes are remembered on this computer (0–100). Sound effects will read
    // window.sfxVolume (0–1) once the game has some.
    const settings = document.getElementById("settings");
    const volumes = [
      { key: "musicVolume", input: "music-volume", fallback: 50, apply: (v) => (music.volume = v) },
      { key: "sfxVolume", input: "sfx-volume", fallback: 70, apply: (v) => (window.sfxVolume = v) },
    ];

    for (const { key, input: id, fallback, apply } of volumes) {
      const input = document.getElementById(id);
      const output = document.getElementById(`${id}-value`);
      let saved = null;
      try { saved = localStorage.getItem(key); } catch {}
      input.value = saved ?? fallback;
      const update = () => {
        output.textContent = `${input.value}%`;
        apply(input.value / 100);
        try { localStorage.setItem(key, input.value); } catch {}
      };
      input.addEventListener("input", update);
      update();
    }

    // ---------- Admin ----------
    // The password is asked every time the popup opens. It's only held in this variable
    // while the popup is open and is never stored.
    const loginForm = document.getElementById("admin-login");
    const passwordInput = document.getElementById("admin-password");
    const loginError = document.getElementById("login-error");
    const adminPanel = document.getElementById("admin-panel");
    const resetStatus = document.getElementById("reset-status");
    let adminPassword = null;

    // Both delete buttons need a second click to confirm.
    const dangerActions = [
      {
        button: document.getElementById("reset-game"),
        label: "Reset game",
        endpoint: "/api/reset",
        warning: "Removes all symptoms, treatments and votes. Players keep their names.",
        done: "The game has been reset.",
      },
      {
        button: document.getElementById("reset-everything"),
        label: "Delete all players and data",
        endpoint: "/api/reset-everything",
        warning: "Removes every player too. Everyone has to join again.",
        done: "All players and game data have been deleted.",
      },
    ];
    let confirming = null;

    function clearConfirmation() {
      confirming = null;
      for (const action of dangerActions) action.button.textContent = action.label;
    }

    function showLogin(error) {
      adminPassword = null;
      passwordInput.value = "";
      loginError.textContent = error ?? "";
      loginError.hidden = !error;
      adminPanel.hidden = true;
      loginForm.hidden = false;
      passwordInput.focus();
    }

    function showAdminPanel() {
      clearConfirmation();
      resetStatus.hidden = true;
      loginForm.hidden = true;
      adminPanel.hidden = false;
    }

    document.getElementById("settings-open").addEventListener("click", () => {
      settings.showModal();
      showLogin();
    });

    // However the popup closes (Close, Cancel, Esc, clicking outside), forget the password.
    settings.addEventListener("close", () => {
      adminPassword = null;
      passwordInput.value = "";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = document.getElementById("login-submit");
      submit.disabled = true;
      const password = passwordInput.value;
      passwordInput.value = "";
      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "X-Admin-Password": password },
      }).catch(() => null);
      submit.disabled = false;
      if (response?.ok) {
        adminPassword = password;
        showAdminPanel();
      } else {
        const body = await response?.json().catch(() => null);
        showLogin(body?.error ?? "Couldn't reach the server. Try again.");
      }
    });

    for (const button of settings.querySelectorAll("[data-close]")) {
      button.addEventListener("click", () => settings.close());
    }
    // Clicking the dark area outside the popup closes it.
    settings.addEventListener("click", (event) => {
      const box = settings.getBoundingClientRect();
      const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
      if (event.target === settings && outside) settings.close();
    });

    for (const action of dangerActions) {
      action.button.addEventListener("click", async () => {
        if (confirming !== action) {
          clearConfirmation();
          confirming = action;
          action.button.textContent = "Are you sure? Click again";
          resetStatus.textContent = action.warning;
          resetStatus.hidden = false;
          return;
        }
        action.button.disabled = true;
        const response = await fetch(action.endpoint, {
          method: "POST",
          headers: { "X-Admin-Password": adminPassword ?? "" },
        }).catch(() => null);
        action.button.disabled = false;
        clearConfirmation();
        if (response?.status === 401) return showLogin("The admin password has changed. Please log in again.");
        if (response?.ok) {
          resetStatus.textContent = action.done;
          entries = [];
          index = 0;
          render(null);
          refresh();
        } else {
          resetStatus.textContent = "Something went wrong. Try again.";
        }
        resetStatus.hidden = false;
      });
    }

    function startMusic() {
      music.play().then(() => {
        document.removeEventListener("pointerdown", startMusic);
        document.removeEventListener("keydown", startMusic);
      }, () => {});
    }

    document.addEventListener("pointerdown", startMusic);
    document.addEventListener("keydown", startMusic);
    startMusic();

    const REFRESH_MS = 60 * 1000;
    const SLIDE_MS = 10 * 1000;
    const showcase = document.getElementById("showcase");
    let entries = [];
    let index = 0;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(entry) {
      if (!entry) {
        showcase.replaceChildren(el("p", "waiting", "Waiting for the first diagnosis…"));
        return;
      }
      const avatar = el("img", "");
      avatar.src = `/avatars/${entry.doctor.avatar}.png`;
      avatar.alt = "";
      const details = el("div", "");
      details.append(
        el("p", "doctor", `Dr. ${entry.doctor.nickname} prescribes:`),
        el("p", "treatment", entry.treatment),
        el("p", "score", entry.score ? `${"👍".repeat(Math.min(entry.score, 5))}${entry.score > 5 ? ` ×${entry.score}` : ""}` : ""),
      );
      const prescription = el("div", "prescription");
      prescription.append(avatar, details);
      showcase.replaceChildren(el("p", "label", "The patient says"), el("p", "symptom", `“${entry.symptom}”`), prescription);
    }

    function nextSlide() {
      if (entries.length < 2) return render(entries[0]);
      showcase.classList.add("fading");
      setTimeout(() => {
        index = (index + 1) % entries.length;
        render(entries[index]);
        showcase.classList.remove("fading");
      }, 600);
    }

    // ---------- Players bar ----------
    const playersTrack = document.getElementById("players-track");
    let shownPlayers = "";

    function renderPlayers(players) {
      // Only rebuild when the list changed, so the scrolling doesn't jump every minute.
      const key = JSON.stringify(players);
      if (key === shownPlayers) return;
      shownPlayers = key;

      playersTrack.classList.remove("scrolling");
      if (!players.length) {
        playersTrack.replaceChildren(el("p", "empty", "Scan the QR code to join!"));
        return;
      }

      const group = el("div", "players-group");
      for (const player of players) {
        const card = el("div", "player");
        const avatar = el("img", "");
        avatar.src = `/avatars/${player.avatar}.png`;
        avatar.alt = "";
        card.append(avatar, el("span", "", `Dr. ${player.nickname}`));
        group.append(card);
      }
      playersTrack.replaceChildren(group);

      // Too many to fit: add a second copy and scroll, about 1.5 seconds per player.
      if (group.scrollWidth > playersTrack.parentElement.clientWidth) {
        const copy = group.cloneNode(true);
        copy.setAttribute("aria-hidden", "true");
        playersTrack.append(copy);
        playersTrack.style.setProperty("--scroll-duration", `${players.length * 1.5}s`);
        playersTrack.classList.add("scrolling");
      }
    }

    async function refreshPlayers() {
      try {
        const response = await fetch("/api/players");
        if (response.ok) renderPlayers(await response.json());
      } catch {
        // Keep showing what we have; try again next minute.
      }
    }

    async function refresh() {
      refreshPlayers();
      try {
        const response = await fetch("/api/showcase");
        if (!response.ok) return;
        const wasEmpty = entries.length === 0;
        entries = await response.json();
        index = Math.min(index, Math.max(entries.length - 1, 0));
        if (wasEmpty) render(entries[0]);
      } catch {
        // Keep showing what we have; try again next minute.
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
    setInterval(nextSlide, SLIDE_MS);
  </script>
</body>
</html>
