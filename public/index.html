<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doc, Is This Normal?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <style>
    html, body {
      overflow: hidden;
    }

    :root {
      --players-bar: 9vw;
      --logo-width: 20vw;
      /* Where the logo ends (it's about half as tall as it is wide). */
      --logo-bottom: calc(1.5vw + var(--logo-width) / 2);
    }

    /* Bandage hangs off the right edge of the screen, QR code sits on its pad. */
    .join {
      position: fixed;
      right: -8.7vw;
      bottom: calc(var(--players-bar) + 0.8vw);
      width: 37vw;
      aspect-ratio: 1024 / 344;
      background: url("/bandage.png") center / contain no-repeat;
    }

    .join img {
      position: absolute;
      left: 50.1%;
      top: 50%;
      width: 22%;
      transform: translate(-50%, -50%);
    }

    .join p {
      position: absolute;
      left: 50.1%;
      bottom: 100%;
      margin: 0 0 0.3vw;
      transform: translateX(-50%);
      font-size: 3.6vw;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      color: var(--white);
      -webkit-text-stroke: 0.5vw var(--navy);
      paint-order: stroke fill;
    }

    /* Game logo, top-left corner. */
    .game-title {
      position: fixed;
      top: 1.5vw;
      left: 1.5vw;
      margin: 0;
      line-height: 0;
    }

    .game-title img {
      width: var(--logo-width);
    }

    /* Round, phase and time left until the next phase, top-right under the mute and settings
       buttons. Each phase has its own colour and icon. */
    .phase-card {
      --phase-color: #74e3b5;
      position: fixed;
      top: calc(1.5vw + clamp(48px, 4.5vw, 96px) + 1.2vw);
      right: 1.5vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      min-width: 30vw;
    }

    .phase-card[data-phase="second_opinions"] {
      --phase-color: #c7b8ff;
    }

    .phase-card .round {
      position: relative;
      z-index: 2;
      margin: 0 0 -1vw;
      padding: 0.3vw 1.3vw;
      font-size: 1.35vw;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--navy);
      border-radius: 999px;
    }

    .phase-card .title {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      position: relative;
      z-index: 1;
      gap: 1vw;
      box-sizing: border-box;
      margin: 0;
      padding: 1.3vw 1.5vw 1vw;
      font-size: 3.1vw;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      background: var(--phase-color);
      border: 0.35vw solid var(--navy);
      border-radius: 1.6vw;
    }

    .phase-card svg {
      flex: none;
      fill: currentColor;
    }

    /* Browsers don't apply "hidden" to inline SVGs by default. */
    .phase-card svg[hidden] {
      display: none;
    }

    .phase-card .title svg {
      width: 3.4vw;
      height: 3.4vw;
    }

    /* Timer bar tucked under the title box. */
    .phase-card .clock {
      display: flex;
      align-items: center;
      gap: 1.1vw;
      width: 92%;
      box-sizing: border-box;
      margin-top: -0.5vw;
      padding: 1.1vw 1.5vw 0.8vw;
      color: var(--white);
      background: var(--navy);
      border-radius: 0 0 1.6vw 1.6vw;
    }

    .phase-card .clock svg {
      width: 2.8vw;
      height: 2.8vw;
      color: #f8b84e;
    }

    .phase-card .timer {
      font-size: 3vw;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .phase-card .until {
      margin: 0;
      padding-left: 1.1vw;
      font-size: 1.15vw;
      font-weight: 500;
      line-height: 1.25;
      border-left: 0.2vw solid rgb(255 255 255 / 0.6);
    }

    .phase-card .until strong {
      display: block;
      font-size: 1.3vw;
      font-weight: 700;
    }

    /* One symptom + prescription pair: the complaint as a speech bubble, the prescription as a
       handwritten slip with a stamp and the doctor's avatar. Sized in em, so the same pair works
       big (Hall of Fame, reveal) and small (three side by side in the finals). */
    .pair {
      display: flex;
      flex-direction: column;
      gap: 1.6em;
    }

    .bubble {
      position: relative;
      margin: 0;
      padding: 0.9em 1.1em;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
      background: var(--white);
      border: 0.18em solid var(--navy);
      border-radius: 1.1em;
    }

    /* The bubble's tail, pointing down-left at the patient. */
    .bubble::after {
      content: "";
      position: absolute;
      left: 1.6em;
      bottom: -0.95em;
      width: 1.2em;
      height: 1.2em;
      background: var(--white);
      border-right: 0.18em solid var(--navy);
      border-bottom: 0.18em solid var(--navy);
      transform: skewY(40deg) rotate(45deg);
    }

    .patient {
      margin: -0.6em 0 0 3.2em;
      font-size: 0.8em;
      font-weight: 700;
      color: var(--white);
    }

    .slip {
      position: relative;
      margin-left: 1.5em;
      padding: 0.9em 1.2em 0.9em 1.2em;
      background:
        repeating-linear-gradient(transparent 0 1.55em, rgb(11 20 51 / 0.12) 1.55em calc(1.55em + 1px)),
        #fffdf3;
      border: 0.12em solid var(--navy);
      border-radius: 0.4em;
      box-shadow: 0.25em 0.3em 0 rgb(11 20 51 / 0.35);
      transform: rotate(-1.2deg);
    }

    .slip .rx {
      margin: 0;
      font-size: 1.1em;
      font-weight: 700;
      color: var(--bandage-dark);
    }

    .slip .written {
      margin: 0.2em 0 0;
      font-family: "Caveat", cursive;
      font-size: 1.55em;
      font-weight: 600;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .slip .signed {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-top: 0.6em;
    }

    .slip .signed img {
      width: 2.8em;
      height: 2.8em;
      object-fit: contain;
      background: var(--pad);
      border: 0.12em solid var(--navy);
      border-radius: 50%;
    }

    .slip .signed span {
      font-family: "Caveat", cursive;
      font-size: 1.4em;
      font-weight: 700;
    }

    .stamp {
      position: absolute;
      top: 0.5em;
      right: 0.7em;
      padding: 0.15em 0.5em;
      font-size: 0.85em;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #c0392b;
      border: 0.18em solid #c0392b;
      border-radius: 0.4em;
      opacity: 0.8;
      transform: rotate(12deg);
    }

    /* Default view: Hall of Fame carousel, kept clear of the bandage in the corner. */
    .hall {
      position: fixed;
      left: 6vw;
      top: calc((var(--logo-bottom) + 100vh - var(--players-bar) - var(--candidates-height, 0px)) / 2);
      width: 54vw;
      font-size: 1.8vw;
      transform: translateY(-50%);
      transition: opacity 0.6s;
    }

    /* Smaller while the candidates strip takes up the bottom of the screen. */
    body.has-candidates .hall {
      font-size: 1.35vw;
    }

    .hall.fading {
      opacity: 0;
    }

    .waiting {
      margin: 0;
      padding: 2.5vw 3vw;
      font-size: 2.4vw;
      font-weight: 700;
      text-align: center;
      background: var(--pad);
      border: 0.4vw solid var(--navy);
      border-radius: 2.5vw;
      box-shadow: 0 0.5vw 0 var(--navy);
    }

    /* Finals: big countdown and the finalists side by side. */
    .finals-view {
      position: fixed;
      top: 1.5vw;
      left: 3vw;
      right: 3vw;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .finals-view h2,
    .reveal-view h2 {
      margin: 0;
      font-size: 3.4vw;
      font-weight: 700;
      line-height: 1;
      color: var(--white);
      -webkit-text-stroke: 0.4vw var(--navy);
      paint-order: stroke fill;
    }

    .countdown {
      margin: 0.3vw 0 1.6vw;
      font-size: 6vw;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--white);
      -webkit-text-stroke: 0.5vw var(--navy);
      paint-order: stroke fill;
    }

    .finalists {
      display: grid;
      grid-template-columns: repeat(var(--count, 3), minmax(0, 30vw));
      justify-content: center;
      gap: 2vw;
      width: 100%;
      font-size: 1.5vw;
    }

    /* Reveal: the winner, big, with the patient's and doctor's names. */
    .reveal-view {
      position: fixed;
      top: calc(var(--logo-bottom) + 1vw);
      left: 6vw;
      width: 54vw;
      display: none;
      flex-direction: column;
      gap: 1.6vw;
      font-size: 1.9vw;
    }

    body.finals .hall,
    body.finals .players,
    body.finals .phase-card,
    body.reveal .hall,
    body.reveal .players {
      display: none;
    }

    body.finals .finals-view,
    body.reveal .reveal-view {
      display: flex;
    }

    /* With the players bar hidden, the bandage drops back to the bottom corner. */
    body.finals .join,
    body.reveal .join {
      bottom: 0.8vw;
    }

    /* Current finals candidates (pairs that have been shown often enough to count), above the
       players bar and left of the bandage. Shows as many as fit, then fades to the next few. */
    .candidates {
      position: fixed;
      left: 1.5vw;
      right: 30vw;
      bottom: calc(var(--players-bar) + 0.6vw);
      display: none;
      font-size: 0.78vw;
      /* Bottom padding keeps the speech bubbles' tails inside the clipped area. */
      padding-bottom: 1.2em;
      overflow: hidden;
    }

    /* Only the cards fade between pages; the countdown ring stays put. */
    .candidates-track {
      transition: opacity 0.5s;
    }

    .candidates-track.fading {
      opacity: 0;
    }

    /* Countdown ring to the next page of candidates, top-right of the strip. It only shows (and
       only runs) when there's more than one page; each completed fill turns the page. */
    .candidates-timer {
      position: absolute;
      top: 0;
      right: 0;
      display: none;
      width: 1.5vw;
      height: 1.5vw;
      transform: rotate(-90deg);
    }

    .candidates.paging .candidates-timer {
      display: block;
    }

    .candidates-timer circle {
      fill: none;
      stroke-width: 6;
    }

    .candidates-timer .track {
      stroke: var(--navy);
    }

    .candidates-timer .progress {
      stroke: #f8b84e;
      stroke-dasharray: 100;
      animation: candidates-timer var(--page-duration, 8s) linear infinite;
    }

    @keyframes candidates-timer {
      from { stroke-dashoffset: 100; }
      to   { stroke-dashoffset: 0; }
    }

    body.has-candidates .candidates {
      display: block;
    }

    .candidates-group {
      display: flex;
      gap: 2em;
    }

    .candidate[hidden] {
      display: none;
    }

    .candidate {
      position: relative;
      display: flex;
      align-items: stretch;
      flex: none;
      /* Room above for the clip and the thumbs-up badge. */
      padding-top: 2em;
    }

    .candidate .circle {
      flex: none;
      width: 5.4em;
      height: 5.4em;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 1em;
      font-weight: 700;
      color: var(--navy);
      border: 0.22em solid var(--navy);
      border-radius: 50%;
    }

    .candidate .circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .candidate .who {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4em;
      flex: none;
      width: 6.4em;
    }

    .candidate .who span {
      max-width: 100%;
      font-size: 0.9em;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    /* The patient's complaint: a speech bubble with its tail at the bottom-left. */
    .candidate .complaint {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1em;
      width: 22em;
      box-sizing: border-box;
      padding: 1em 1.2em;
      background: var(--pad);
      border: 0.22em solid var(--navy);
      border-radius: 1.4em;
    }

    .candidate .complaint::after {
      content: "";
      position: absolute;
      left: 1.6em;
      bottom: -1.05em;
      width: 1.3em;
      height: 1.3em;
      background: var(--pad);
      border-right: 0.22em solid var(--navy);
      border-bottom: 0.22em solid var(--navy);
      transform: skewY(40deg) rotate(45deg);
    }

    .candidate .complaint .circle {
      background: #f4897b;
    }

    .candidate .text {
      margin: 0;
      font-size: 1.2em;
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    /* The prescription on public/clipboard.png, used as a 9-slice frame: the corners and the clip
       keep their shape and only the plain sides and paper stretch. The image is 1536px wide and
       the board 20em, so 1px of the image = 20/1536 em; the slice sizes below follow from that.
       The image has transparent margins (47px left, 150px above the frame, 89px below), so the
       board is shifted to line its frame up with the speech bubble. */
    .candidate .board {
      display: flex;
      width: 20em;
      box-sizing: border-box;
      margin: -1.95em 0 -1.16em -0.83em;
      border-style: solid;
      border-width: 3.125em 1.432em 1.875em;
      border-image: url("/clipboard.png") 240 110 144 fill / 3.125em 1.432em 1.875em;
    }

    .candidate .paper {
      display: flex;
      align-items: center;
      gap: 0.8em;
      flex: 1;
      padding: 0.2em 0.4em 0 0.3em;
    }

    .candidate .rx {
      align-self: flex-start;
      margin: 0;
      font-size: 2.2em;
      font-weight: 700;
      line-height: 1;
    }

    .candidate .paper .text {
      flex: 1;
      font-size: 1.1em;
      font-weight: 500;
    }

    .candidate .board .circle {
      background: #74e3b5;
    }

    /* Thumbs-up count, sitting on the seam between the bubble and the clipboard. */
    .candidate .badge {
      position: absolute;
      /* Centred on the top edge of the bubble and clipboard (2em down the card, in badge em). */
      top: calc(2em / 1.3);
      transform: translate(-50%, -50%);
      /* On the seam, 22em into the card. The badge's own text is 1.3× bigger, so its em is too. */
      left: calc(22em / 1.3);
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.3em;
      padding: 0.15em 0.7em 0.15em 0.5em;
      font-size: 1.3em;
      font-weight: 700;
      line-height: 1.2;
      background: #f4897b;
      border: 0.18em solid var(--navy);
      border-radius: 999px;
    }

    .candidate .badge svg {
      width: 1.1em;
      height: 1.1em;
      fill: var(--white);
      stroke: var(--navy);
      stroke-width: 60;
      paint-order: stroke fill;
    }

    /* Everyone who has joined, along the bottom. Scrolls sideways when they don't all fit. */
    .players {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 2vw;
      height: var(--players-bar);
      padding: 0 0 0 2.5vw;
      box-sizing: border-box;
      background: var(--navy);
    }

    .players h2 {
      flex: none;
      margin: 0;
      font-size: 3vw;
      font-weight: 700;
      color: var(--white);
    }

    .players-viewport {
      flex: 1;
      min-width: 0;
      padding-left: 2vw;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, #000 2vw, #000 calc(100% - 4vw), transparent);
    }

    .players-track {
      display: flex;
      width: max-content;
    }

    /* The list is shown twice in a row, so sliding by half its width loops seamlessly. */
    .players-track.scrolling {
      animation: players-scroll var(--scroll-duration) linear infinite;
    }

    @keyframes players-scroll {
      to { transform: translateX(-50%); }
    }

    /* The space after the last player equals the gap between players, so the loop is even. */
    .players-group {
      display: flex;
      gap: 1.2vw;
      padding-right: 1.2vw;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3vw;
      width: 6.6vw;
    }

    .player img {
      width: 5.6vw;
      height: 5.6vw;
      box-sizing: border-box;
      padding: 0.3vw;
      object-fit: contain;
      background: var(--pad);
      border-radius: 1.2vw;
    }

    .player span {
      max-width: 100%;
      overflow: hidden;
      font-size: 1.15vw;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .players .empty {
      margin: 0;
      font-size: 1.8vw;
      font-weight: 700;
      color: var(--white);
    }

    @media (prefers-reduced-motion: reduce) {
      .players-track.scrolling { animation: none; }
    }

    /* Mute and settings buttons, top-right corner */
    .corner-button {
      --size: clamp(48px, 4.5vw, 96px);
      position: fixed;
      top: 1.5vw;
      right: 1.5vw;
      display: grid;
      place-items: center;
      width: var(--size);
      height: var(--size);
      padding: 0;
      color: var(--navy);
      background: var(--pad);
      border: clamp(4px, 0.35vw, 7px) solid var(--navy);
      border-radius: 24%;
      cursor: pointer;
    }

    .corner-button.mute {
      right: calc(1.5vw + var(--size) + 1vw);
    }

    .corner-button svg {
      width: 62%;
      height: 62%;
      fill: currentColor;
    }

    /* Browsers don't apply "hidden" to inline SVGs by default. */
    .corner-button svg[hidden] {
      display: none;
    }

    .corner-button:active {
      transform: scale(0.94);
    }

    .settings {
      width: min(420px, calc(100vw - 32px));
      box-sizing: border-box;
      padding: 24px;
      font-family: inherit;
      color: var(--navy);
      background: var(--pad);
      border: 5px solid var(--navy);
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--navy);
    }

    .settings::backdrop {
      background: rgb(11 20 51 / 0.5);
    }

    .settings h2 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .settings label {
      display: block;
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 700;
    }

    .settings input[type="password"] {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 14px;
      font: 500 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 14px;
    }

    .settings input[type="password"]:focus {
      outline: 4px solid var(--bandage);
    }

    .settings .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .settings input[type="range"] {
      flex: 1;
      accent-color: var(--bandage-dark);
    }

    .settings output {
      width: 3.5em;
      font-weight: 500;
      text-align: right;
    }

    .settings button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font: 700 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 4px solid var(--navy);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--navy);
      cursor: pointer;
    }

    .settings button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--navy);
    }

    .settings {
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }

    .settings .timing {
      margin: 0 0 8px;
      padding: 0;
      border: 0;
    }

    .settings .timing legend {
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .settings .timing-grid {
      display: grid;
      grid-template-columns: 1fr 96px;
      gap: 8px 12px;
      align-items: center;
    }

    .settings .timing-grid label {
      margin: 0;
      font-weight: 500;
    }

    .settings input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      font: 500 18px "Fredoka", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      border: 3px solid var(--navy);
      border-radius: 10px;
    }

    .settings .danger {
      color: var(--white);
      background: #c0392b;
    }

    .settings #reset-game {
      margin-top: 24px;
    }

    .settings .reset-status {
      margin: 10px 0 0;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <audio id="music" src="/audio/peachtea-somewhere-in-the-elevator.ogg" loop autoplay></audio>

  <button type="button" class="corner-button mute" id="mute-toggle" aria-label="Mute" aria-pressed="false">

  </button>

  <button type="button" class="corner-button" id="settings-open" aria-label="Settings">
    <!-- "settings" icon from Google Material Symbols (Apache 2.0) -->
    <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M421-80q-14 0-25-9t-13-23l-15-94q-19-7-40-19t-37-25l-86 40q-14 6-28 1.5T155-226L97-330q-8-13-4.5-27t15.5-23l80-59q-2-9-2.5-20.5T185-480q0-9 .5-20.5T188-521l-80-59q-12-9-15.5-23t4.5-27l58-104q8-13 22-17.5t28 1.5l86 40q16-13 37-25t40-18l15-95q2-14 13-23t25-9h118q14 0 25 9t13 23l15 94q19 7 40.5 18.5T669-710l86-40q14-6 27.5-1.5T804-734l59 104q8 13 4.5 27.5T852-580l-80 57q2 10 2.5 21.5t.5 21.5q0 10-.5 21t-2.5 21l80 58q12 8 15.5 22.5T863-330l-58 104q-8 13-22 17.5t-28-1.5l-86-40q-16 13-36.5 25.5T592-206l-15 94q-2 14-13 23t-25 9H421Zm59-270q54 0 92-38t38-92q0-54-38-92t-92-38q-54 0-92 38t-38 92q0 54 38 92t92 38Z"/></svg>
  </button>

  <dialog class="settings" id="settings">
    <form id="admin-login" method="dialog">
      <h2>Admin only</h2>
      <label>
        Password
        <input type="password" id="admin-password" autocomplete="off" required>
      </label>
      <p class="reset-status" id="login-error" hidden></p>
      <button type="submit" id="login-submit">Unlock</button>
      <button type="button" data-close>Cancel</button>
    </form>

    <div id="admin-panel" hidden>
      <h2>Settings</h2>
      <label>
        Music volume
        <span class="volume-row">
          <input type="range" id="music-volume" min="0" max="100" step="5">
          <output for="music-volume" id="music-volume-value"></output>
        </span>
      </label>
      <label>
        Sound effects volume
        <span class="volume-row">
          <input type="range" id="sfx-volume" min="0" max="100" step="5">
          <output for="sfx-volume" id="sfx-volume-value"></output>
        </span>
      </label>
      <fieldset class="timing">
        <legend>Phase lengths (minutes)</legend>
        <div class="timing-grid">
          <label for="timing-first_clinic_open">First Clinic open</label>
          <input type="number" id="timing-first_clinic_open" min="0.5" max="600" step="0.5">
          <label for="timing-clinic_open">Clinic open</label>
          <input type="number" id="timing-clinic_open" min="0.5" max="600" step="0.5">
          <label for="timing-second_opinions">Second opinions</label>
          <input type="number" id="timing-second_opinions" min="0.5" max="600" step="0.5">
          <label for="timing-finals">Finals</label>
          <input type="number" id="timing-finals" min="0.5" max="600" step="0.5">
          <label for="timing-reveal">Reveal</label>
          <input type="number" id="timing-reveal" min="0.5" max="600" step="0.5">
        </div>
        <button type="button" id="save-timing">Save phase lengths</button>
      </fieldset>
      <button type="button" id="skip-phase">Skip to next phase</button>
      <button type="button" id="restart-round">Restart this round</button>
      <button type="button" class="danger" id="reset-game">Reset game</button>
      <button type="button" class="danger" id="reset-everything">Delete all players and data</button>
      <p class="reset-status" id="reset-status" hidden></p>
      <button type="button" data-close>Close</button>
    </div>
  </dialog>

  <h1 class="game-title"><img src="/title_logo.png" alt="Doc, is this normal?"></h1>

  <!-- "stethoscope", "thumbs_up_down" and "schedule" icons from Google Material Symbols (Apache 2.0) -->
  <section class="phase-card" id="phase-card" hidden>
    <p class="round" id="phase-round"></p>
    <p class="title">
      <svg viewBox="0 -960 960 960" aria-hidden="true" data-phase-icon="clinic_open"><path d="M540-81q-112 0-186-78.5T280-347v-35q-85-11-142.5-75.71T80-610v-200q0-12.75 8.63-21.38Q97.25-840 110-840h90v-10q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v80q0 12-8.68 21-8.67 9-21.5 9-12.82 0-21.32-8.63-8.5-8.62-8.5-21.37v-10h-60v170q0 71 49.5 120.5T310-440q71 0 120.5-49.5T480-610v-170h-60v10q0 12-8.68 21-8.67 9-21.5 9-12.82 0-21.32-8.63-8.5-8.62-8.5-21.37v-80q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v10h90q12.75 0 21.38 8.62Q540-822.75 540-810v200q0 87.58-57.5 152.29T340-382v35q0 85 56.5 145.5T540-141q81 0 140.5-60.15T740-347.23V-424q-35-10-57.5-39T660-530q0-45.83 32.12-77.92 32.12-32.08 78-32.08T848-607.92q32 32.09 32 77.92 0 38-22.5 67T800-424v77q0 111-76.5 188.5T540-81Zm265.5-413.32q14.5-14.33 14.5-35.5 0-21.18-14.32-35.68-14.33-14.5-35.5-14.5-21.18 0-35.68 14.32-14.5 14.33-14.5 35.5 0 21.18 14.32 35.68 14.33 14.5 35.5 14.5 21.18 0 35.68-14.32ZM770-530Z"/></svg>
      <svg viewBox="0 -960 960 960" aria-hidden="true" data-phase-icon="second_opinions"><path d="M60-400q-24 0-42-18T0-460v-270q0-10 3-18t11-17l145-145q6.88-7 15.29-10.5 8.42-3.5 16.83-3.5 19.88 0 34.38 15.5Q240-893 235-870l-21 110h216q21.25 0 35.63 14.37Q480-731.25 480-710v39q0 7-1 12.5t-2 7.5l-93 220q-6.08 14.64-19.54 22.82Q351-400 330-400H60Zm270-60 90-209v-31H139l28-133L60-725v265h270Zm200 260q-21.25 0-35.62-14.38Q480-228.75 480-250v-39q0-7 1-12.5t2-7.5l93-220q6-15 19.5-23t34.5-8h270q24 0 42 18t18 42v270q0 10-3 18t-11 17L801-50q-6.88 7-15.29 10.5-8.42 3.5-16.83 3.5Q749-36 734.5-51.5 720-67 725-90l21-110H530Zm100-300-90 209v31h281l-28 133 107-108v-265H630ZM60-472v-253 253Zm840-16v253-253Z"/></svg>
      <span id="phase-name"></span>
    </p>
    <div class="clock">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M513-492v-171q0-13-8.5-21.5T483-693q-13 0-21.5 8.5T453-663v183q0 6 2 11t6 10l144 149q9 10 22.5 9.5T650-310q9-9 9-22t-9-22L513-492ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Z"/></svg>
      <span class="timer" id="phase-timer"></span>
      <p class="until">until <strong id="phase-next"></strong></p>
    </div>
  </section>

  <section class="hall" id="hall" aria-live="polite">
    <p class="waiting">Waiting for the first diagnosis…</p>
  </section>

  <section class="finals-view" aria-live="polite">
    <h2>Finals</h2>
    <p class="countdown" id="finals-countdown"></p>
    <div class="finalists" id="finalists"></div>
  </section>

  <section class="reveal-view" id="reveal" aria-live="polite">
    <h2>Winner!</h2>
  </section>

  <section class="candidates" id="candidates" aria-label="Finals candidates">
    <div class="candidates-track" id="candidates-track"></div>
    <svg class="candidates-timer" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="track" cx="12" cy="12" r="9"/>
      <circle class="progress" id="candidates-progress" cx="12" cy="12" r="9" pathLength="100"/>
    </svg>
  </section>

  <section class="players" aria-label="Players">
    <h2>Players:</h2>
    <div class="players-viewport">
      <div class="players-track" id="players-track"></div>
    </div>
  </section>

  <div class="join">
    <p>SCAN ME!</p>
    <img src="/qr.svg" alt="QR code to join the game">
  </div>

  <script>
    // Background music starts as soon as the page loads. If the browser blocks autoplay,
    // it starts on the first click or key press instead.
    const music = document.getElementById("music");

    // ---------- Settings ----------
    // Volumes are remembered on this computer (0–100). Sound effects will read
    // window.sfxVolume (0–1) once the game has some.
    const settings = document.getElementById("settings");
    const muteButton = document.getElementById("mute-toggle");
    const volumes = [
      { key: "musicVolume", input: "music-volume", fallback: 50, apply: (v) => (music.volume = v) },
      { key: "sfxVolume", input: "sfx-volume", fallback: 70, apply: (v) => (window.sfxVolume = v) },
    ];

    for (const volume of volumes) {
      const input = document.getElementById(volume.input);
      const output = document.getElementById(`${volume.input}-value`);
      let saved = null;
      try { saved = localStorage.getItem(volume.key); } catch {}
      volume.get = () => Number(input.value);
      volume.set = (value) => {
        input.value = value;
        output.textContent = `${input.value}%`;
        volume.apply(input.value / 100);
        try { localStorage.setItem(volume.key, input.value); } catch {}
        updateMuteButton();
      };
      input.addEventListener("input", () => volume.set(input.value));
      volume.set(saved ?? volume.fallback);
    }

    // ---------- Mute ----------
    // Muting sets every volume to 0 and remembers the old levels; unmuting puts them back.
    // It counts as muted whenever all volumes are 0, however they got there.
    function isMuted() {
      return volumes.every((volume) => volume.get() === 0);
    }

    function updateMuteButton() {
      // Skip while the volumes are still being set up on page load.
      if (!volumes.every((volume) => volume.get)) return;
      const muted = isMuted();
      muteButton.setAttribute("aria-pressed", String(muted));
      muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
      // SVG elements have no .hidden property, so toggle the attribute itself.
      muteButton.querySelector('[data-icon="on"]').toggleAttribute("hidden", muted);
      muteButton.querySelector('[data-icon="off"]').toggleAttribute("hidden", !muted);
    }

    muteButton.addEventListener("click", () => {
      if (isMuted()) {
        let before = null;
        try { before = JSON.parse(localStorage.getItem("volumesBeforeMute")); } catch {}
        const restore = volumes.map((volume) => before?.[volume.key] ?? 0);
        // Nothing worth restoring (e.g. they were dragged to 0 by hand): use the defaults.
        const useDefaults = restore.every((value) => value === 0);
        volumes.forEach((volume, i) => volume.set(useDefaults ? volume.fallback : restore[i]));
      } else {
        const before = Object.fromEntries(volumes.map((volume) => [volume.key, volume.get()]));
        try { localStorage.setItem("volumesBeforeMute", JSON.stringify(before)); } catch {}
        for (const volume of volumes) volume.set(0);
      }
    });

    // ---------- Admin ----------
    // The password is asked every time the popup opens. It's only held in this variable
    // while the popup is open and is never stored.
    const loginForm = document.getElementById("admin-login");
    const passwordInput = document.getElementById("admin-password");
    const loginError = document.getElementById("login-error");
    const adminPanel = document.getElementById("admin-panel");
    const resetStatus = document.getElementById("reset-status");
    let adminPassword = null;

    // Every button that changes the game needs a second click to confirm.
    const dangerActions = [
      {
        button: document.getElementById("skip-phase"),
        label: "Skip to next phase",
        endpoint: "/api/admin/skip-phase",
        warning: "Ends the current phase now.",
        done: "Moved on to the next phase.",
      },
      {
        button: document.getElementById("restart-round"),
        label: "Restart this round",
        endpoint: "/api/admin/restart-round",
        warning: "Starts this round again from Clinic open. Symptoms and prescriptions stay.",
        done: "The round has restarted.",
      },
      {
        button: document.getElementById("reset-game"),
        label: "Reset game",
        endpoint: "/api/reset",
        warning: "Removes all symptoms, prescriptions, votes and the Hall of Fame, and starts again from round 1. Players keep their names.",
        done: "The game has been reset.",
      },
      {
        button: document.getElementById("reset-everything"),
        label: "Delete all players and data",
        endpoint: "/api/reset-everything",
        warning: "Removes every player too. Everyone has to join again.",
        done: "All players and game data have been deleted.",
      },
    ];
    let confirming = null;

    function clearConfirmation() {
      confirming = null;
      for (const action of dangerActions) action.button.textContent = action.label;
    }

    function showLogin(error) {
      adminPassword = null;
      passwordInput.value = "";
      loginError.textContent = error ?? "";
      loginError.hidden = !error;
      adminPanel.hidden = true;
      loginForm.hidden = false;
      passwordInput.focus();
    }

    function showAdminPanel() {
      clearConfirmation();
      resetStatus.hidden = true;
      loginForm.hidden = true;
      adminPanel.hidden = false;
      loadTiming();
    }

    const TIMING_KEYS = ["first_clinic_open", "clinic_open", "second_opinions", "finals", "reveal"];

    function adminFetch(url, method = "GET", body) {
      return fetch(url, {
        method,
        headers: { "X-Admin-Password": adminPassword ?? "", ...(body ? { "Content-Type": "application/json" } : {}) },
        body: body && JSON.stringify(body),
      }).catch(() => null);
    }

    async function loadTiming() {
      const response = await adminFetch("/api/admin/settings");
      if (!response?.ok) return;
      const { timing } = await response.json();
      for (const key of TIMING_KEYS) document.getElementById(`timing-${key}`).value = timing[key];
    }

    document.getElementById("save-timing").addEventListener("click", async () => {
      clearConfirmation();
      const timing = Object.fromEntries(TIMING_KEYS.map((key) => [key, Number(document.getElementById(`timing-${key}`).value)]));
      const response = await adminFetch("/api/admin/settings", "PUT", { timing });
      if (response?.status === 401) return showLogin("The admin password has changed. Please log in again.");
      const body = await response?.json().catch(() => null);
      resetStatus.textContent = response?.ok ? "Phase lengths saved." : body?.error ?? "Something went wrong. Try again.";
      resetStatus.hidden = false;
      refreshScreen();
    });

    document.getElementById("settings-open").addEventListener("click", () => {
      settings.showModal();
      showLogin();
    });

    // However the popup closes (Close, Cancel, Esc, clicking outside), forget the password.
    settings.addEventListener("close", () => {
      adminPassword = null;
      passwordInput.value = "";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = document.getElementById("login-submit");
      submit.disabled = true;
      const password = passwordInput.value;
      passwordInput.value = "";
      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "X-Admin-Password": password },
      }).catch(() => null);
      submit.disabled = false;
      if (response?.ok) {
        adminPassword = password;
        showAdminPanel();
      } else {
        const body = await response?.json().catch(() => null);
        showLogin(body?.error ?? "Couldn't reach the server. Try again.");
      }
    });

    for (const button of settings.querySelectorAll("[data-close]")) {
      button.addEventListener("click", () => settings.close());
    }
    // Clicking the dark area outside the popup closes it.
    settings.addEventListener("click", (event) => {
      const box = settings.getBoundingClientRect();
      const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
      if (event.target === settings && outside) settings.close();
    });

    for (const action of dangerActions) {
      action.button.addEventListener("click", async () => {
        if (confirming !== action) {
          clearConfirmation();
          confirming = action;
          action.button.textContent = "Are you sure? Click again";
          resetStatus.textContent = action.warning;
          resetStatus.hidden = false;
          return;
        }
        action.button.disabled = true;
        const response = await adminFetch(action.endpoint, "POST");
        action.button.disabled = false;
        clearConfirmation();
        if (response?.status === 401) return showLogin("The admin password has changed. Please log in again.");
        if (response?.ok) {
          resetStatus.textContent = action.done;
          refreshScreen();
        } else {
          resetStatus.textContent = "Something went wrong. Try again.";
        }
        resetStatus.hidden = false;
      });
    }

    function startMusic() {
      music.play().then(() => {
        document.removeEventListener("pointerdown", startMusic);
        document.removeEventListener("keydown", startMusic);
      }, () => {});
    }

    document.addEventListener("pointerdown", startMusic);
    document.addEventListener("keydown", startMusic);
    startMusic();

    // ---------- Waiting-room chime ----------
    // Played with the Web Audio API at the start of the finals and at the reveal, at the
    // sound-effects volume. Browsers only allow audio after the first click, like the music.
    let audio = null;

    function unlockAudio() {
      audio ??= new AudioContext();
      if (audio.state === "suspended") audio.resume();
    }

    document.addEventListener("pointerdown", unlockAudio);
    document.addEventListener("keydown", unlockAudio);

    function playChime(ctx, {
      notes = [550, 440],
      gap = 0.6,
      decay = 1.5,
      type = "triangle",
      volume = 0.4,
    } = {}) {
      notes.forEach((freq, i) => {
        const t = ctx.currentTime + i * gap;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(volume, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + decay);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + decay);
      });
    }

    function chime() {
      unlockAudio();
      if (window.sfxVolume > 0) playChime(audio, { volume: 0.4 * window.sfxVolume });
    }

    // ---------- Game screen ----------
    const POLL_MS = 10 * 1000;
    const SLIDE_MS = 10 * 1000;
    const PHASE_NAMES = { clinic_open: "Clinic open", second_opinions: "Second opinions", finals: "Finals" };
    const NEXT_PHASE_NAMES = { clinic_open: "Second opinions", second_opinions: "Finals", finals: "the reveal" };
    const hall = document.getElementById("hall");
    let screen = null;
    let clockOffset = 0;
    let hallIndex = 0;
    let shownFinalists = "";
    let shownReveal = "";

    function el(tag, className, text) {
      const node = document.createElement(tag);
      node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // A symptom + prescription pair. Names are left out during the finals.
    function pairElement(entry, { names = true } = {}) {
      const pair = el("div", "pair");
      pair.append(el("p", "bubble", `“${entry.symptom}”`));
      if (names && entry.patient) pair.append(el("p", "patient", entry.patient));

      const slip = el("div", "slip");
      const avatar = el("img", "");
      avatar.src = `/avatars/${entry.doctor.avatar}.png`;
      avatar.alt = "";
      const signed = el("div", "signed");
      signed.append(avatar);
      if (names && entry.doctor.name) signed.append(el("span", "", entry.doctor.name));
      slip.append(el("p", "rx", "℞"), el("p", "written", entry.prescription), signed, el("span", "stamp", "APPROVED"));
      pair.append(slip);
      return pair;
    }

    function formatTime(ms) {
      const left = Math.max(0, ms);
      return `${Math.floor(left / 60000)}:${String(Math.floor((left % 60000) / 1000)).padStart(2, "0")}`;
    }

    function renderTimers() {
      if (!screen) return;
      const left = screen.state.phaseEndsAt - (Date.now() + clockOffset);
      document.getElementById("phase-timer").textContent = formatTime(left);
      document.getElementById("finals-countdown").textContent = formatTime(left);
    }

    function renderHall() {
      const entries = screen?.hallOfFame ?? [];
      hallIndex = entries.length ? hallIndex % entries.length : 0;
      if (!entries.length) hall.replaceChildren(el("p", "waiting", "Waiting for the first diagnosis…"));
      else hall.replaceChildren(pairElement(entries[hallIndex]));
    }

    function nextSlide() {
      const entries = screen?.hallOfFame ?? [];
      if (entries.length < 2) return;
      hall.classList.add("fading");
      setTimeout(() => {
        hallIndex = (hallIndex + 1) % entries.length;
        renderHall();
        hall.classList.remove("fading");
      }, 600);
    }

    function render(previous) {
      const { state } = screen;
      const card = document.getElementById("phase-card");
      card.hidden = false;
      card.dataset.phase = state.phase;
      document.getElementById("phase-round").textContent = `Round ${state.round}`;
      document.getElementById("phase-name").textContent = PHASE_NAMES[state.phase];
      document.getElementById("phase-next").textContent = NEXT_PHASE_NAMES[state.phase];
      for (const icon of card.querySelectorAll("[data-phase-icon]")) {
        icon.toggleAttribute("hidden", icon.dataset.phaseIcon !== state.phase);
      }
      document.body.classList.toggle("finals", state.phase === "finals");
      document.body.classList.toggle("reveal", state.phase !== "finals" && Boolean(state.reveal));

      // Only rebuild the finalists and the reveal when they change, so nothing flickers.
      const finalistsKey = JSON.stringify(state.finalists);
      if (finalistsKey !== shownFinalists) {
        shownFinalists = finalistsKey;
        const list = document.getElementById("finalists");
        list.style.setProperty("--count", state.finalists.length || 3);
        list.replaceChildren(...state.finalists.map((entry) => pairElement(entry, { names: false })));
      }
      const revealKey = JSON.stringify(state.reveal);
      if (revealKey !== shownReveal) {
        shownReveal = revealKey;
        const reveal = document.getElementById("reveal");
        reveal.replaceChildren(el("h2", "", "Winner!"));
        if (state.reveal) reveal.append(pairElement(state.reveal));
      }
      renderHall();
      renderTimers();

      // The chime marks the shared moments: the finals starting, and the winner being revealed.
      if (previous) {
        const finalsStarted = state.phase === "finals" && previous.phase !== "finals";
        const winnerRevealed = state.reveal && JSON.stringify(state.reveal) !== JSON.stringify(previous.reveal);
        if (finalsStarted || winnerRevealed) chime();
      }
    }

    async function refreshScreen() {
      try {
        const response = await fetch("/api/screen");
        if (!response.ok) return;
        const previous = screen?.state;
        screen = await response.json();
        clockOffset = screen.state.now - Date.now();
        render(previous);
        renderPlayers(screen.players);
        fitPlayers();
        renderCandidates(screen.candidates);
      } catch {
        // Keep showing what we have; try again on the next poll.
      }
    }

    // Count down every second; ask the server every 10 seconds, and right when a phase runs out.
    setInterval(() => {
      renderTimers();
      if (screen && Date.now() + clockOffset > screen.state.phaseEndsAt + 1000) refreshScreen();
    }, 1000);
    setInterval(refreshScreen, POLL_MS);
    setInterval(nextSlide, SLIDE_MS);

    // ---------- Finals candidates ----------
    // "thumb_up" icon from Google Material Symbols (Apache 2.0)
    const THUMB_ICON = '<svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M860-632q23 0 41.5 18.5T920-572v82q0 11-2.5 25.5T910-439L794-171q-9 21-29.5 36T721-120H314q-25 0-42.5-17.5T254-180v-428q0-11 4.5-22t12.5-19l207-218q14-14 33.5-17t36.5 7q17 10 25.5 28t4.5 37l-38 180h320ZM137-120q-23 0-40-17t-17-40v-398q0-23 17-40t40-17q23 0 40 17t17 40v398q0 23-17 40t-40 17Z"/></svg>';
    const candidatesStrip = document.getElementById("candidates");
    const candidatesTrack = document.getElementById("candidates-track");
    let shownCandidates = "";

    function circle(avatar, fallback) {
      const node = el("div", "circle");
      if (avatar) {
        const img = el("img", "");
        img.src = `/avatars/${avatar}.png`;
        img.alt = "";
        node.append(img);
      } else {
        node.textContent = fallback;
      }
      return node;
    }

    function candidateElement(entry) {
      const card = el("div", "candidate");

      const patient = el("div", "who");
      patient.append(
        circle(entry.patientAvatar, "?"),
        el("span", "", entry.patientAvatar ? `Patient ${entry.patient}` : entry.patient),
      );
      const complaint = el("div", "complaint");
      complaint.append(patient, el("p", "text", entry.symptom));

      const doctor = el("div", "who");
      doctor.append(circle(entry.doctor.avatar), el("span", "", entry.doctor.name));
      const paper = el("div", "paper");
      paper.append(el("p", "rx", "℞"), el("p", "text", entry.prescription), doctor);
      const board = el("div", "board");
      board.append(paper);

      const badge = el("div", "badge");
      badge.innerHTML = THUMB_ICON;
      badge.append(String(entry.thumbsUp));

      card.append(complaint, board, badge);
      return card;
    }

    function renderCandidates(candidates) {
      const visible = screen.state.phase !== "finals" && !document.body.classList.contains("reveal") && candidates.length > 0;
      document.body.classList.toggle("has-candidates", visible);

      const key = JSON.stringify(candidates);
      if (key !== shownCandidates) {
        shownCandidates = key;
        const group = el("div", "candidates-group");
        group.append(...candidates.map(candidateElement));
        candidatesTrack.replaceChildren(group);
      }
      showCandidatePage();
      // Tell the Hall of Fame how much room the strip takes.
      document.documentElement.style.setProperty("--candidates-height", visible ? `${candidatesStrip.offsetHeight}px` : "0px");
    }

    // Pages of as many whole cards as fit side by side; a new page every few seconds.
    const CANDIDATE_PAGE_MS = 8 * 1000;
    let candidatePage = 0;

    function showCandidatePage() {
      const cards = [...candidatesTrack.querySelectorAll(".candidate")];
      if (!cards.length) return;
      // All cards are the same width, so measure one to see how many fit.
      cards[0].hidden = false;
      const gap = parseFloat(getComputedStyle(cards[0].parentElement).columnGap) || 0;
      const perPage = Math.max(1, Math.floor((candidatesStrip.clientWidth + gap) / (cards[0].offsetWidth + gap)));
      const pages = Math.ceil(cards.length / perPage);
      candidatePage %= pages;
      cards.forEach((card, i) => (card.hidden = Math.floor(i / perPage) !== candidatePage));
      candidatesStrip.classList.toggle("paging", pages > 1);
      return pages;
    }

    // The countdown ring sets the pace: every time it fills up, fade to the next page.
    candidatesStrip.style.setProperty("--page-duration", `${CANDIDATE_PAGE_MS}ms`);
    document.getElementById("candidates-progress").addEventListener("animationiteration", () => {
      candidatesTrack.classList.add("fading");
      setTimeout(() => {
        candidatePage++;
        showCandidatePage();
        candidatesTrack.classList.remove("fading");
      }, 500);
    });

    // ---------- Players bar ----------
    const playersTrack = document.getElementById("players-track");
    let shownPlayers = "";

    function renderPlayers(players) {
      // Only rebuild when the list changed, so the scrolling doesn't jump every minute.
      const key = JSON.stringify(players);
      if (key === shownPlayers) return;
      shownPlayers = key;

      playersTrack.classList.remove("scrolling");
      if (!players.length) {
        playersTrack.replaceChildren(el("p", "empty", "Scan the QR code to join!"));
        return;
      }

      const group = el("div", "players-group");
      for (const player of players) {
        const card = el("div", "player");
        const avatar = el("img", "");
        avatar.src = `/avatars/${player.avatar}.png`;
        avatar.alt = "";
        card.append(avatar, el("span", "", player.nickname));
        group.append(card);
      }
      playersTrack.replaceChildren(group);
      fitPlayers();
    }

    function fitPlayers() {
      fitMarquee(playersTrack, "players-group", 1.5);
    }

    // Too many items to fit: add a second copy and scroll, secondsPerItem per item. Checked again
    // whenever a strip may have changed size, since a hidden strip (finals, reveal) measures as 0.
    function fitMarquee(track, groupClass, secondsPerItem) {
      const group = track.querySelector(`.${groupClass}`);
      const available = track.parentElement.clientWidth;
      if (!group || !available) return;
      const overflows = group.scrollWidth > available;
      if (overflows === track.classList.contains("scrolling")) return;

      track.classList.toggle("scrolling", overflows);
      if (overflows) {
        const copy = group.cloneNode(true);
        copy.setAttribute("aria-hidden", "true");
        track.append(copy);
        track.style.setProperty("--scroll-duration", `${group.children.length * secondsPerItem}s`);
      } else {
        track.replaceChildren(group);
      }
    }

    window.addEventListener("resize", () => {
      fitPlayers();
      if (screen) renderCandidates(screen.candidates);
    });

    refreshScreen();
  </script>
</body>
</html>
